[package]
name = "bonegrader-client"
description = "Client-side execution: turn an UpdatePlan + user decisions into safe, transactional filesystem changes."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Optional HTTP fetcher (ureq). Kept behind a feature so the pure logic crate
# stays dependency-light for tests.
http = ["dep:ureq"]

[dependencies]
bonegrader-core = { path = "../core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
fastnbt.workspace = true
tempfile.workspace = true
time.workspace = true
ureq = { version = "2", optional = true }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
