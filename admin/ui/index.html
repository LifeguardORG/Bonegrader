<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonegrader Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="icon.svg" alt="" width="28" height="28" />
      <div>
        <h1>Bonegrader Admin</h1>
        <p class="subtitle">Channel-Updates prüfen und veröffentlichen</p>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>Einstellungen</h2>
        <div class="grid">
          <label class="full">Instanz-Ordner (Quelle des Packs)
            <input id="instance" type="text" placeholder="/pfad/zur/curseforge/instanz" />
          </label>
          <label>Channel
            <input id="channel" type="text" placeholder="main" />
          </label>
          <label>Pack-Name
            <input id="pack" type="text" placeholder="BonesAndBees" />
          </label>
          <label class="full">Channel-URL (Basis fürs Manifest + Live-Vergleich)
            <input id="baseUrl" type="text" placeholder="https://bonegrader.example.com/main" />
          </label>
          <label>SSH-Ziel
            <input id="sshHost" type="text" placeholder="deploy@dein-server" />
          </label>
          <label>Remote-Basis
            <input id="remoteBase" type="text" placeholder="/srv/bonegrader" />
          </label>
          <label class="full">Ignorieren (Dev-Mods, eine Datei/Pfad pro Zeile)
            <textarea id="ignore" rows="2" placeholder="mods/dev-only.jar"></textarea>
          </label>
        </div>

        <details class="more">
          <summary>Erweitert: Signatur, Client-Versionen, Server, Standard-Einstellungen</summary>
          <div class="grid">
            <label class="full">Signatur-Schlüssel (Pfad, leer = nicht signieren)
              <input id="signKey" type="text" placeholder="~/.config/bonegrader/manifest-signing.key" />
            </label>
            <label>Mindest-Client-Version (ältere Clients werden blockiert)
              <input id="minClientVersion" type="text" placeholder="z. B. 1.2.0" />
            </label>
            <label>Aktuelle Client-Version (Update-Hinweis)
              <input id="latestClientVersion" type="text" placeholder="z. B. 1.2.0" />
            </label>
            <label class="full">Download-Seite für Bonegrader
              <input id="clientDownloadUrl" type="text" placeholder="https://bonegrader.example.com/" />
            </label>
            <label>Server-Name (für die Mehrspieler-Liste)
              <input id="serverName" type="text" placeholder="BonesAndBees" />
            </label>
            <label>Server-Adresse (leer = nicht eintragen)
              <input id="serverAddress" type="text" placeholder="play.example.com" />
            </label>
            <label class="full">Standard-Einstellungen – nur anlegen, wenn beim Spieler fehlend (Datei oder Ordner pro Zeile; erlaubt: options.txt, config/, defaultconfigs/, kubejs/)
              <textarea id="seeds" rows="2" placeholder="config/jei"></textarea>
            </label>
          </div>
        </details>

        <label class="check"><input id="gc" type="checkbox" /> Lokale Orphan-Blobs nach dem Bauen aufräumen (GC)</label>
        <div class="actions">
          <button id="previewBtn" type="button">Vorschau</button>
          <button id="publishBtn" class="ghost" type="button" disabled>Veröffentlichen</button>
        </div>
      </section>

      <section id="resultCard" class="card hidden">
        <h2>Vorschau</h2>
        <div id="summary" class="summary"></div>
        <div id="diffBody"></div>
        <div id="progress" class="progress hidden">
          <div class="bar"><div id="bar" class="fill"></div></div>
          <p id="progressText" class="muted"></p>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
