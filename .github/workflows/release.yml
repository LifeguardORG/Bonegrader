name: release

# Build native installers for every OS and attach them to a GitHub Release.
# Trigger by pushing a version tag, e.g.:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # -> .msi + .exe (NSIS)
          - platform: ubuntu-22.04 # -> .AppImage + .deb
          - platform: macos-latest # -> .dmg (Apple Silicon)
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file wget curl libgtk-3-dev

      # Static frontend (plain HTML/JS) — no npm build step needed.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: "Bonegrader ${{ github.ref_name }}"
          releaseBody: "Bonegrader-Client — Installer unten. Windows: `.msi`/`.exe`, Linux: `.AppImage`/`.deb`, macOS: `.dmg`."
          releaseDraft: true
          prerelease: false
